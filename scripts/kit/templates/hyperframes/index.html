<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: #0c0b0a; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Noto Sans SC", sans-serif; color: #f1ebdf; }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .bg { background: radial-gradient(1100px 700px at 50% 40%, #2a1d16, #0c0b0a 70%); }
      .word { font: 900 220px "Noto Sans SC", sans-serif; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
      .word.serif { font: 600 180px "Noto Serif SC", serif; letter-spacing: 0.1em; }
      .accent { color: #d97757; }
      .sub { margin-top: 28px; font: 400 30px "Cascadia Code", monospace; letter-spacing: 0.4em; color: rgba(241,235,223,.55); }
      .bar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: #d97757; transform-origin: 0 50%; }
      .cap { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 36px; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
      .cap b { color: #f2b36b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="{{W}}" data-height="{{H}}">
      <div class="clip bg" data-start="0" data-duration="8" data-track-index="0"></div>

      <div id="s1" class="clip" data-start="0.3" data-duration="2.4" data-track-index="1">
        <div class="word">写<span class="accent">代码</span></div>
        <div class="sub">HTML · DATA-START</div>
      </div>
      <div id="s2" class="clip" data-start="2.7" data-duration="2.4" data-track-index="1">
        <div class="word">出<span class="accent">视频</span></div>
        <div class="sub">GSAP · TIMELINE</div>
      </div>
      <div id="s3" class="clip" data-start="5.1" data-duration="2.9" data-track-index="1">
        <div class="word serif">{{TITLE}}</div>
        <div class="sub">HYPERFRAMES</div>
      </div>

      <div id="bar" class="bar clip" data-start="0" data-duration="8" data-track-index="2" style="inset:auto 0 0 0;height:10px;display:block"></div>
      <div id="cap" class="cap clip" data-start="3.2" data-duration="4.2" data-track-index="3" style="inset:auto 0 40px 0;display:block"><b>hyperframes</b> · {{TYPE_DESC}}</div>
    </div>
    <script>
      // 太宽的大字按舞台宽度缩小（竖屏、长标题），留 10% 边距
      document.querySelectorAll('.word').forEach((el) => {
        const max = {{W}} * 0.9, w = el.scrollWidth;
        if (w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w).toFixed(1) + 'px';
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // 每个场景：进场弹出 + 出场滑走
      [['#s1', 0.3, 2.7], ['#s2', 2.7, 5.1], ['#s3', 5.1, 8.0]].forEach(([id, a, b], i) => {
        tl.fromTo(id + ' .word', { yPercent: 60, opacity: 0, scale: 0.9 }, { yPercent: 0, opacity: 1, scale: 1, duration: 0.7, ease: 'expo.out' }, a)
          .fromTo(id + ' .sub', { opacity: 0, letterSpacing: '1.2em' }, { opacity: 1, letterSpacing: '0.4em', duration: 0.9, ease: 'power3.out' }, a + 0.25);
        if (i < 2) tl.to(id + ' .word', { yPercent: -60, opacity: 0, duration: 0.45, ease: 'power2.in' }, b - 0.45);
      });
      tl.fromTo('#bar', { scaleX: 0 }, { scaleX: 1, duration: 8, ease: 'none' }, 0)
        .fromTo('#cap', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 3.2)
        .to('#root', { opacity: 0, duration: 0.6 }, 7.4);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
